; ============================================================================
; Cardputer-Adv HiFi Player — PlatformIO Configuration
; Hardware: M5Stack Cardputer-Adv (Stamp-S3A / ESP32-S3FN8, 8MB Flash, NO PSRAM)
; Audio:    ES8311 DAC (I2C 0x18) + I2S (BCK=41, WS=43, DOUT=42) + 3.5mm auto
; Codecs:   MP3, M4A (AAC-MP4), AAC (ADTS), WAV, FLAC via ESP32-audioI2S (no-PSRAM)
; ============================================================================

[env:cardputer_adv]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino

board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_unflags =
    -Os
    -std=gnu++11
build_flags =
    -std=gnu++17
    -O3
    -funroll-loops
    -ffast-math
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    m5stack/M5GFX@^0.2.17
    m5stack/M5Unified@^0.2.10
    m5stack/M5Cardputer@^1.1.1
        https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
